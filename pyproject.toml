[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mcp-breakbench"
version = "0.1.0"
description = "A reproducible MCP contract and fault lab"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Ama Senevirathne" }]
dependencies = ["mcp==2.1.1", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "types-jsonschema>=4.23,<5",
]

[project.scripts]
mcp-breakbench = "mcp_breakbench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_breakbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["mcp_breakbench"]
